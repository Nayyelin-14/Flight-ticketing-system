<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to SKYFLARE</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#27272a;">
  <div style="max-width:560px;margin:0 auto;padding:40px 20px;">
    <div style="background:linear-gradient(135deg,#18181b 0%,#1e293b 100%);border-radius:16px;overflow:hidden;border:1px solid #27272a;">
      <!-- Header -->
      <div style="padding:40px 40px 0;text-align:center;">
        <div style="display:inline-block;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:12px;padding:12px 24px;margin-bottom:24px;">
          <span style="font-size:18px;font-weight:800;letter-spacing:2px;color:#ffffff;">SKYFLARE</span>
        </div>
      </div>

      <!-- Body -->
      <div style="padding:32px 40px 40px;">
        <h1 style="margin:0 0 8px;font-size:26px;font-weight:700;color:#ffffff;text-align:center;">
          Welcome aboard{{ ', ' ~ name if name else '' }}!
        </h1>
        <p style="margin:0 0 32px;font-size:15px;color:#a1a1aa;text-align:center;line-height:1.6;">
          Your account is ready. Just one step to start booking flights.
        </p>

        <!-- Verify Button -->
        <div style="text-align:center;margin:0 0 32px;">
          <a href="{{ verification_url }}" style="display:inline-block;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#ffffff;padding:14px 36px;border-radius:10px;text-decoration:none;font-size:15px;font-weight:600;letter-spacing:0.3px;">
            Verify My Email
          </a>
        </div>

        <!-- Divider -->
        <div style="border-top:1px solid #27272a;margin:0 0 24px;"></div>

        <!-- Info -->
        <p style="margin:0;font-size:13px;color:#52525b;text-align:center;line-height:1.6;">
          This link expires in 24 hours. If you didn't create an account, you can safely ignore this email.
        </p>
      </div>
    </div>

    <!-- Footer -->
    <p style="text-align:center;color:#71717a;font-size:12px;margin-top:20px;">
      SKYFLARE &middot; Fly beyond limits
    </p>
  </div>
</body>
</html>
